[workspace]
resolver = "2"
members = [
    "crates/tide-core",
    "crates/tide-cli",
    "crates/tidectl",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["Tide OS contributors"]
repository = "https://github.com/Tide-OS/Tide"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.8"
libc = "0.2"

[profile.release]
strip = true
lto = "thin"
