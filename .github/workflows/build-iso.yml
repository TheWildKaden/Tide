name: Build live ISO

on:
  workflow_dispatch:
    inputs:
      desktop:
        description: Desktop profile
        required: true
        default: kde
        type: choice
        options: [kde, xfce, minimal, none]

permissions:
  contents: read

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build ISO (${{ inputs.desktop }})
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h
      - name: Install build dependencies
        run: ./scripts/install-dev-deps.sh
      - name: Environment check
        run: ./build.sh doctor
      - name: Build Tide ISO
        run: ./build.sh --desktop "${{ inputs.desktop }}" all
      - name: Verify artifacts
        run: ./build.sh verify
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: tide-iso-${{ inputs.desktop }}
          path: |
            output/*.iso
            output/*.sha256
            output/SHA256SUMS
            output/manifests/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Record validation limits
        run: |
          {
            echo "## Tide ISO build"
            echo ""
            echo "The ISO was generated and checksums were verified. This workflow does **not** boot the image."
            echo "Boot, Calamares installation, and hardware behaviour remain unverified until tested in a VM or on hardware."
          } >> "$GITHUB_STEP_SUMMARY"
