name: Build live ISO

on:
  workflow_dispatch:
    inputs:
      desktop:
        description: Desktop profile
        required: true
        default: kde
        type: choice
        options: [kde, xfce, minimal, none]
      release_tag:
        description: Optional existing release tag to upload the ISO to (leave blank for artifact only)
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build ISO (${{ inputs.desktop }})
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h
      - name: Build Tide ISO
        run: ./scripts/build-iso-in-container.sh --desktop "${{ inputs.desktop }}" all
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: tide-iso-${{ inputs.desktop }}
          path: |
            output/*.iso
            output/*.sha256
            output/SHA256SUMS
            output/manifests/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload ISO to existing release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::release $TAG does not exist; use the release workflow to create it"
            exit 1
          fi
          gh release upload "$TAG" \
            output/*.iso \
            output/*.sha256 \
            output/SHA256SUMS \
            output/manifests/*.json \
            --clobber
      - name: Record validation limits
        run: |
          {
            echo "## Tide ISO build"
            echo ""
            echo "The ISO was generated and checksums were verified. This workflow does **not** boot the image."
            echo "Boot, Calamares installation, and hardware behaviour remain unverified until tested in a VM or on hardware."
          } >> "$GITHUB_STEP_SUMMARY"
