name: Build and Publish Release ISO

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-release:
    name: Build ISO and upload release asset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap live-build rsync

      - name: Make scripts executable
        run: |
          chmod +x build.sh rootfs-config.sh

      - name: Bootstrap Debian rootfs
        run: |
          ./build.sh bootstrap

      - name: Configure rootfs
        run: |
          ./build.sh configure

      - name: Build ISO
        run: |
          ./build.sh build-iso

      - name: Locate generated ISO
        id: locate_iso
        run: |
          iso=$(find live-build -type f -name '*.iso' | head -n 1)
          if [ -z "$iso" ]; then
            echo 'No ISO file found in live-build' >&2
            exit 1
          fi
          echo "iso_path=$iso" >> $GITHUB_OUTPUT

      - name: Upload release ISO asset
        uses: actions/upload-release-asset@v3
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ${{ steps.locate_iso.outputs.iso_path }}
          asset_name: ${{ github.event.release.tag_name }}.iso
          asset_content_type: application/octet-stream
