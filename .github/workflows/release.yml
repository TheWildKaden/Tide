name: Build and publish release ISO

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build ISO and attach release assets
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h
      - name: Install build dependencies
        run: ./scripts/install-dev-deps.sh
      - name: Environment check
        run: ./build.sh doctor
      - name: Build ISO and manifest
        run: ./build.sh all
      - name: Verify checksums
        run: ./build.sh verify
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tide-release-${{ github.event.release.tag_name }}
          path: |
            output/*.iso
            output/*.sha256
            output/SHA256SUMS
            output/manifests/*.json
          if-no-files-found: error
      - name: Attach assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" \
            output/*.iso \
            output/*.sha256 \
            output/SHA256SUMS \
            output/manifests/*.json \
            --clobber
      - name: Record validation limits
        run: |
          {
            echo "## Tide release build"
            echo ""
            echo "Checksums and the release manifest were generated. Release assets are **not** signed yet."
            echo "The ISO was not booted by this workflow. Validate boot, installer, and hardware support separately."
          } >> "$GITHUB_STEP_SUMMARY"
