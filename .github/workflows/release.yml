name: Build and publish release ISO

# Publish flow:
#   * push a tag like `v0.1.0-alpha.1` -> build and create/update that release
#   * run manually with an existing tag -> build and attach to that release
#
# The ISO is never published from pull requests. Publishing needs `contents: write`.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to build and publish (for example v0.1.0-alpha.1)
        required: true
        type: string
      desktop:
        description: Desktop profile
        required: true
        default: kde
        type: choice
        options: [kde, xfce, minimal, none]
      prerelease:
        description: Mark the release as a prerelease when creating it
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build ISO and attach release assets
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      DESKTOP: ${{ inputs.desktop || 'kde' }}
      PRERELEASE: ${{ inputs.prerelease || false }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install build dependencies
        run: ./scripts/install-dev-deps.sh

      - name: Environment check
        run: ./build.sh doctor

      - name: Build ISO and manifest
        run: ./build.sh --desktop "$DESKTOP" all

      - name: Verify checksums
        run: ./build.sh verify

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tide-release-${{ env.TAG }}
          path: |
            output/*.iso
            output/*.sha256
            output/SHA256SUMS
            output/manifests/*.json
          if-no-files-found: error

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            args=(release create "$TAG" --verify-tag
                  --title "Tide OS $TAG" --generate-notes)
            if [[ "$PRERELEASE" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh "${args[@]}"
          fi
          gh release upload "$TAG" \
            output/*.iso \
            output/*.sha256 \
            output/SHA256SUMS \
            output/manifests/*.json \
            --clobber

      - name: Record validation limits
        run: |
          {
            echo "## Tide release build: $TAG"
            echo ""
            echo "Checksums and the release manifest were generated. Release assets are **not** signed yet."
            echo "The ISO was not booted by this workflow. Validate boot, installer, and hardware support separately."
          } >> "$GITHUB_STEP_SUMMARY"
