# Tide OS Calamares installer configuration.
#
# This is an installer foundation, not a validated installer. It must be tested in
# a booted live image before it can be described as working.
---
modules-search:
  - local
  - /usr/lib/calamares/modules

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - bootloader-config
      - grubcfg
      - bootloader
      - initramfscfg
      - initramfs
      - removeuser
      - umount
  - show:
      - finished

branding: tide
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: true
